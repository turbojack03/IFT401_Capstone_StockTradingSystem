{% extends "base.html" %}
{% block title %}settings{% endblock %}
{% block content %}


  <h1>Settings</h1>
  <p>This is where Settings details will go.</p>





<div class="row justify-content-center my-4">
<div class="col-10 col-md-6 col-lg-4">
<div class="d-grid gap-2">
<button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Log Out
</button>


<button type="button" class="btn btn-dark"
        onclick="window.location.href='{{ url_for('changepassword') }}'">
  Change Password
</button>

<button type="button" class="btn btn-dark" >
  Change Theme
</button>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Toggle Dark/Light Theme</label>
</div>


<button type="button" class="btn btn-dark" >
  Timezone
</button>


<button type="button" class="btn btn-dark" >
  Market Hours
</button>
<button type="button" class="btn btn-dark" >
  Disable Learning Tips
</button>


<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Logging Out</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">No</button>
        <a class="btn btn-success" href="{{ url_for('logout') }}">Yes</a>
      </div>
    </div>
  </div>
</div>


{% endblock %}
