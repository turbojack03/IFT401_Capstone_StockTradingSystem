<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('frontend_files', filename='styles.css') }}">
  <title>{% block title %}{% endblock %} - Bamboo StockSim</title>


</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">



      <a class="navbar-brand" href="{{ url_for('dashboard') }}">Bamboo StockSim</a>

      <img src="{{ url_for('frontend_files', filename='bamboo2.png') }}" alt="Bamboo2"
        style="height:30px; width:auto; margin-right:10px;">

      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              Profile
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">

              <li><a class="dropdown-item" href="{{ url_for('profile') }}">View Profile</a></li>
              <li><a class="dropdown-item" href="{{ url_for('settings') }}">Settings</a></li>
              <li><a class="dropdown-item" href="{{ url_for('portfolio') }}">Portfolio</a></li>
              <li><a class="dropdown-item" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
          </li>


          <li class="nav-item"><a class="nav-link hidden"
              href="{{ url_for('questionmarkquestionmarkquestionmark') }}">???</a></li>

        </ul>
      </div>
    </div>


  </nav>



  {% block content %}
  <main class="container mt-4">

    <h1>Welcome to Bamboo StockSim!</h1>
    <p>Your ultimate stock market simulation experience.</p>


  </main>

  <body class="d-flex flex-column min-vh-100">
    <main class="flex-shrink-0">
      <div class="container mt-4">
        {% endblock %}
      </div>
    </main>

    <footer class="footer mt-auto py-3 bg-dark text-light mt-5">
      <img src="{{ url_for('frontend_files', filename='bamboo.png') }}" alt="Bamboo stalk" class="bamboo left-bamboo">

      <div class="container py-3">
        <p class="text-center mb-0">© 2024 Epic Stock Sim App</p>
      </div>

      <img src="{{ url_for('frontend_files', filename='bamboo.png') }}" alt="Bamboo stalk" class="bamboo right-bamboo">
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('frontend_files', filename='script.js') }}"></script>

  </body>

</html>
